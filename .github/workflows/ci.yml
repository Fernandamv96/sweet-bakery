name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sweet-bakery
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sweet-bakery/package-lock.json

      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build (vite)
        run: npm run build
